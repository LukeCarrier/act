on:
  push:

jobs:
  test-upload-download:
    runs-on: ubuntu-latest
    steps:
      - name: Create test artifact file
        run: echo "Test artifact content" > artifact.txt

      - name: Upload artifact (v4 archive format)
        uses: actions/upload-artifact@v4
        with:
          name: test-artifact
          path: artifact.txt

      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: test-artifact
          path: downloaded

      - name: Verify artifact content
        run: |
          if [[ "$(cat downloaded/artifact.txt)" != "Test artifact content" ]]; then
            echo "Downloaded artifact content does not match"
            exit 1
          fi
        shell: bash
